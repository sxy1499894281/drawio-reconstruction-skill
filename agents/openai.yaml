interface:
  display_name: "Draw.io Reconstruction"
  short_description: "Reviewed Draw.io reconstruction with optional editable PPTX"
  default_prompt: "Use $drawio-reconstruction to rebuild this diagram image or folder into editable Draw.io files. For every image, keep production and acceptance separate. Each production or repair round uses a fresh Producer on the current artifacts; each acceptance round uses a different fresh read-only Reviewer. Only Reviewers may return PASS after checking icon assets or the full preview plus actual-placement icon sheet. Do not send work to completed agents because cached responses are not new turns. Repeat without a fixed time or round limit. Only when requested, convert the current Draw.io to editable PPTX after all reconstruction reviews, or handle an existing Draw.io conversion directly without reconstructing again."
